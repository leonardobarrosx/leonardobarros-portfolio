<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found — Leonardo Barros</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/leonardobarros-portfolio/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root { --paper: #efe9df; --ink: #141110; --accent: #e3301c; --mute: #6f655c; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; background: var(--paper); color: var(--ink);
             font-family: "Inter", system-ui, sans-serif; display: grid; place-items: center; padding: 8vw; }
      main { max-width: 46ch; }
      .code { font-family: "Anton", Impact, sans-serif; font-size: clamp(88px, 22vw, 240px); line-height: .82;
               letter-spacing: -.02em; margin: 0 0 24px; }
      .code span { color: var(--accent); }
      p { font-size: 17px; line-height: 1.55; margin: 0 0 28px; color: #2b2521; }
      .mono { font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
      .top { color: var(--mute); margin-bottom: 40px; display: block; }
      a.btn { display: inline-flex; align-items: center; gap: 10px; font-family: "Anton", Impact, sans-serif;
               font-size: 26px; text-transform: uppercase; text-decoration: none; color: inherit;
               border: 1px solid currentColor; border-radius: 999px; padding: 10px 20px; transition: background .3s, color .3s; }
      a.btn:hover { background: var(--ink); color: var(--paper); }
    </style>
  </head>
  <body>
    <main>
      <span class="mono top">Leonardo Barros · Error</span>
      <h1 class="code">4<span>0</span>4</h1>
      <p>This page does not exist, or it moved. The work, the experience and the way to reach me are all on the home page.</p>
      <a class="btn" href="/leonardobarros-portfolio/">Take me home <span aria-hidden="true">&rarr;</span></a>
    </main>
  </body>
</html>
